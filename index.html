<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>SHOP — ონლაინ მაღაზია</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="responsive.css" />
  </head>
  <body class="shop-page">
    <header>
      <nav aria-label="მთავარი ნავიგაცია">
        <a class="shop-brand" href="index.html"><span>S</span> SHOP</a>
        <ul>
          <li><button type="button" onclick="allProduct()" aria-pressed="true">ყველა</button></li>
        </ul>

        <div class="right-nav">
          <div class="cart-wrapper">
            <a class="cart-toggle" href="cart/cart.html" aria-label="კალათის ნახვა">
              <i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>
              <span class="quantity">0</span>
            </a>
            <div class="cart-items" id="cart-items">
              <h2>კალათა</h2>
              <div class="cart-list"></div>
              <p class="cart-status" role="status"></p>
              <button class="cart-retry" type="button" hidden>ხელახლა ცდა</button>
              <div class="cart-total" aria-live="polite">სულ: <strong>0.00 $</strong></div>
            </div>
          </div>
          <button aria-label="ჩემი პროფილი" class="profile" onclick="goToProfile()">
            <i class="fa-solid fa-circle-user"></i>
          </button>
          <button class="login-btn" onclick="openForm()">Log in</button>
          <button class="sign-out login-btn" onclick="signOutFuction()">
            Sign out
          </button>
        </div>
      </nav>

      <div class="overlay"></div>
      <form class="login-form" action="" novalidate onsubmit="logIn(event)">
        <div class="form-div">
          <button type="button" class="dialog-close" aria-label="დახურვა" onclick="closeForm()">×</button>
          <div></div>
          <div class="right-div">
            <ul>
              <li>
                <a href=""><i class="fa-brands fa-facebook"></i></a>
              </li>
              <li>
                <a href=""><i class="fa-brands fa-google"></i></a>
              </li>
              <li>
                <a href=""><i class="fa-brands fa-instagram"></i></a>
              </li>
              <li>
                <a href=""><i class="fa-brands fa-x-twitter"></i></a>
              </li>
            </ul>

            <div class="field">
              <input type="email" name="email" id="login-email" aria-label="ელფოსტა" autocomplete="username" aria-describedby="login-email-error" />
              <p class="field-error" id="login-email-error" aria-live="polite" hidden></p>
            </div>
            <div class="field">
              <input type="password" name="password" id="login-password" aria-label="პაროლი" autocomplete="current-password" aria-describedby="login-password-error" />
              <p class="field-error" id="login-password-error" aria-live="polite" hidden></p>
            </div>
            <p class="login-error" role="alert" hidden></p>
            <div class="form-login-btn">
              <button>Log In</button>
              <button class="sign-up" onclick="openSignInForm()" type="button">
                Sign Up
              </button>
            </div>
          </div>
        </div>
      </form>

      <form class="registartion-form" onsubmit="registartion(event)">
        <div class="reg-form-div">
          <button type="button" class="dialog-close" aria-label="დახურვა" onclick="closeForm()">×</button>

          <div class="reg-field">
            <label for="">firstName</label>
            <input type="text" name="firstName" />
          </div>

          <div class="reg-field">
            <label for="">lastName</label>
            <input type="text" name="lastName" />
          </div>

          <div class="reg-field">
            <label for="">age</label>
            <input type="number" name="age" />
          </div>

          <div class="reg-field">
            <label for="">email</label>
            <input type="email" name="email" />
          </div>

          <div class="reg-field">
            <label for="">password</label>
            <input type="password" name="password" minlength="8" />
          </div>

          <div class="reg-field">
            <label for="">address</label>
            <input type="text" name="address" />
          </div>

          <div class="reg-field">
            <label for="">phone</label>
            <input type="tel" name="phone" value="+995 " />
          </div>

          <div class="reg-field">
            <label for="">zipcode</label>
            <input type="text" name="zipcode" />
          </div>

          <div class="reg-field">
            <label for="">avatar</label>
            <input type="text" name="avatar" />
          </div>

          <div class="reg-field">
            <label for="">gender</label>
            <select name="gender">
              <option value="" disabled selected>Select gender</option>
              <option value="MALE">MALE</option>
              <option value="FEMALE">FEMALE</option>
              <option value="OTHER">OTHER</option>
            </select>
          </div>
          <button type="submit">Sign up</button>
        </div>
      </form>
    </header>

    <main id="catalog"><div class="catalog-heading"><p>შენი შემდეგი არჩევანი</p><h1>აღმოაჩინე ტექნოლოგია.</h1></div>
    <div class="search-and-filter-div">
      <div class="search-div">
        <input
          type="search"
          class="input"
          placeholder="მოძებნე პროდუქტი…" aria-label="პროდუქტის ძებნა"
          oninput="search(this.value)"
        />
      </div>

      <div class="price-div">
        <input
          type="search"
          class="min"
          placeholder="ფასი-დან" aria-label="მინიმალური ფასი" inputmode="decimal"
          oninput="filterByPrice()"
        />
        <input
          type="search"
          class="max"
          placeholder="ფასი-მდე" aria-label="მაქსიმალური ფასი" inputmode="decimal"
          oninput="filterByPrice()"
        />
      </div>
    </div>
    <p class="cart-notice" role="status" hidden></p>
    <section class="container" aria-live="polite"></section>
    <nav class="pagination" aria-label="პროდუქტების გვერდები">
      <button type="button" data-page="1" aria-current="page">1</button>
      <button type="button" data-page="2">2</button>
      <button type="button" data-page="3">3</button>
    </nav>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/js-cookie@3.0.8/dist/js.cookie.min.js"></script>
    <script src="cart/cart.js"></script>
    <script src="registration-validation.js"></script>
    <script src="app.js"></script>
    <script src="password-toggle.js"></script>
    <script src="shop-ux.js"></script>
  </body>
</html>
